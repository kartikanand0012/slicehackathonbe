services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-slicesplit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-slicesplit}
      POSTGRES_DB: ${DB_NAME:-slicesplit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-slicesplit} -d ${DB_NAME:-slicesplit}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Expose only inside the compose network by default; uncomment to debug.
    # ports:
    #   - "5433:5432"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: slicesplit-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-slicesplit}:${DB_PASSWORD:-slicesplit}@postgres:5432/${DB_NAME:-slicesplit}?schema=public
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - generate one with openssl rand -base64 48}"
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
